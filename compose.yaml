services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wechat_bot
      POSTGRES_USER: wechat_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wechat_bot -d wechat_bot"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    profiles: ["web"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.infrastructure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WECHAT_BOT_API_TOKEN: ${WECHAT_BOT_API_TOKEN:?Set WECHAT_BOT_API_TOKEN in .env}
      WECHAT_BOT_DATABASE_URL: postgresql://wechat_bot:${POSTGRES_PASSWORD}@postgres:5432/wechat_bot
      WECHAT_BOT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - api_data:/app/data
volumes:
  postgres_data:
  redis_data:
  api_data:
