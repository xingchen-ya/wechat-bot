name: infrastructure
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-services:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: wechat_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d wechat_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://test:disposable_ci_password@127.0.0.1:5432/wechat_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      WECHAT_BOT_DEPLOYMENT_TARGET: web-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-infrastructure.txt pytest pytest-asyncio ruff
      - run: python -m ruff check backend/core/storage.py backend/core/postgres_memory.py backend/core/postgres_vectors.py backend/core/scheduled_messages.py backend/core/contact_style.py backend/core/langchain_rag.py scripts/migrate_postgres.py scripts/bootstrap_infrastructure.py tests/test_storage_backends.py tests/test_infrastructure_integration.py tests/test_contact_style_and_langchain.py tests/test_scheduled_sender.py tests/test_infrastructure_api.py
      - run: python -m pytest tests/test_storage_backends.py tests/test_infrastructure_integration.py tests/test_contact_style_and_langchain.py tests/test_scheduled_sender.py tests/test_infrastructure_api.py tests/test_infrastructure_bootstrap.py tests/test_bot.py::test_scheduled_sender_initialization_failure_cleans_up -q
